<!doctype html>
<html lang="en">
  <head>
    <base target="_top" />
    <?!= include_("Stylesheet"); ?>
  </head>
  <body>
    <main class="form-shell">
      <div class="form-introduction">
        <p class="eyebrow">Contact NETYR</p>
        <h1>Send us a message</h1>
        <p>
          Tell us how we can help. Required fields are marked with an
          <span aria-hidden="true">*</span>.
        </p>
      </div>

      <form id="contact-form" novalidate>
        <input
          id="sessionToken"
          name="sessionToken"
          type="hidden"
          value="<?= sessionToken ?>"
        />

        <div aria-hidden="true" class="honeypot">
          <label for="website">Leave this field blank</label>
          <input
            autocomplete="off"
            id="website"
            name="website"
            tabindex="-1"
            type="text"
          />
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="firstName"
              >First Name <span aria-hidden="true">*</span></label
            >
            <input
              autocomplete="given-name"
              id="firstName"
              maxlength="60"
              name="firstName"
              required
              type="text"
            />
            <p class="field-error" id="firstName-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="lastName"
              >Last Name <span aria-hidden="true">*</span></label
            >
            <input
              autocomplete="family-name"
              id="lastName"
              maxlength="60"
              name="lastName"
              required
              type="text"
            />
            <p class="field-error" id="lastName-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="email"
              >Email Address <span aria-hidden="true">*</span></label
            >
            <input
              autocomplete="email"
              id="email"
              maxlength="254"
              name="email"
              required
              type="email"
            />
            <p class="field-error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="phone">Phone Number</label>
            <input
              autocomplete="tel"
              id="phone"
              inputmode="tel"
              maxlength="30"
              name="phone"
              type="tel"
            />
            <p class="field-error" id="phone-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="county">County <span aria-hidden="true">*</span></label>
            <input
              autocomplete="address-level2"
              id="county"
              maxlength="80"
              name="county"
              required
              type="text"
            />
            <p class="field-error" id="county-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="inquiryType"
              >Inquiry Type <span aria-hidden="true">*</span></label
            >
            <select id="inquiryType" name="inquiryType" required>
              <option value="">Choose a topic</option>
              <option>General Question</option>
              <option>Membership</option>
              <option>Upcoming Event</option>
              <option>Volunteer</option>
              <option>Sponsorship</option>
              <option>Media</option>
              <option>Other</option>
            </select>
            <p class="field-error" id="inquiryType-error" role="alert"></p>
          </div>

          <div class="field field-wide">
            <label for="preferredContactMethod">Preferred Contact Method</label>
            <select
              aria-describedby="preferredContactMethod-help"
              id="preferredContactMethod"
              name="preferredContactMethod"
            >
              <option value="">No preference</option>
              <option>Email</option>
              <option>Phone</option>
              <option>Either</option>
            </select>
            <p class="field-help" id="preferredContactMethod-help">
              If you choose Phone, include a phone number above.
            </p>
            <p
              class="field-error"
              id="preferredContactMethod-error"
              role="alert"
            ></p>
          </div>

          <div class="field field-wide">
            <label for="message"
              >Message <span aria-hidden="true">*</span></label
            >
            <textarea
              aria-describedby="message-help"
              id="message"
              maxlength="2000"
              minlength="10"
              name="message"
              required
              rows="7"
            ></textarea>
            <p class="field-help" id="message-help">
              Include at least 10 characters and no sensitive information.
            </p>
            <p class="field-error" id="message-error" role="alert"></p>
          </div>
        </div>

        <div class="consent-row">
          <input id="consent" name="consent" required type="checkbox" />
          <div>
            <label for="consent">
              I consent to NETYR contacting me about this inquiry.
              <span aria-hidden="true">*</span>
            </label>
            <p class="field-error" id="consent-error" role="alert"></p>
          </div>
        </div>

        <div
          aria-live="polite"
          class="submission-status"
          id="submission-status"
          role="status"
          tabindex="-1"
        ></div>

        <div class="form-actions">
          <button id="submit-button" type="submit">
            <span id="submit-label">Send Message</span>
            <span aria-hidden="true" class="spinner" hidden id="spinner"></span>
          </button>
          <button class="retry-button" hidden id="retry-button" type="button">
            Try Again
          </button>
        </div>
      </form>

      <section
        aria-live="polite"
        class="success-panel"
        hidden
        id="success-panel"
        tabindex="-1"
      >
        <h2>Message received</h2>
        <p id="success-message"></p>
      </section>
    </main>

    <?!= include_("JavaScript"); ?>
  </body>
</html>
